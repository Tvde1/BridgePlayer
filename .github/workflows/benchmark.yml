name: Benchmark

on:
  push:
    branches: [main]
  pull_request_target:

jobs:
  run-benchmarks:
    name: Run performance benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore BridgePlayer.Benchmarks/BridgePlayer.Benchmarks.csproj

      - name: Build
        run: dotnet build BridgePlayer.Benchmarks/BridgePlayer.Benchmarks.csproj --no-restore --configuration Release

      - name: Run benchmarks
        run: >
          dotnet run
          --project BridgePlayer.Benchmarks/BridgePlayer.Benchmarks.csproj
          --configuration Release
          --no-build
          -- --exporters fullJson --filter '*'

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: BenchmarkDotNet.Artifacts/results/

  report-benchmarks:
    name: Report benchmark results
    needs: run-benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Download benchmark results
        uses: actions/download-artifact@v4
        with:
          name: benchmark-results
          path: BenchmarkDotNet.Artifacts/results/

      - name: Check if gh-pages branch exists
        id: gh-pages-check
        run: |
          if git ls-remote --heads origin gh-pages | grep -q gh-pages; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Store benchmark results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: benchmarkdotnet
          output-file-path: BenchmarkDotNet.Artifacts/results/BridgePlayer.Benchmarks.SimulationBenchmarks-report-full.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Publish results to the gh-pages branch on pushes to main
          auto-push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          # Skip fetching gh-pages if the branch doesn't exist yet (first run)
          skip-fetch-gh-pages: ${{ steps.gh-pages-check.outputs.exists == 'false' }}
          # Alert when a benchmark is 10% slower than the baseline
          alert-threshold: '110%'
          # Post a comment on the PR when performance regresses
          comment-on-alert: true
          # Fail the workflow if a benchmark exceeds the alert threshold
          fail-on-alert: true
          # Tag the PR comment with the author to notify them
          alert-comment-cc-users: '@Tvde1'
